# Add to the Factorio compose project:
#   docker compose -f <factorio compose> -f <this repo>/deploy/docker-compose.relay.yml up -d --build
# The Factorio service itself also needs: network_mode: host, command: ["--enable-lua-udp=34198"]
services:
  factorio-ha-relay:
    build: ../relay
    container_name: factorio-ha-relay
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      FHA_RCON_PASSWORD_FILE: /run/rconpw
    volumes:
      # rconpw from the Factorio data dir. factoriotools' README uses /opt/factorio;
      # set FACTORIO_DATA_DIR (shell or the compose project's .env) if yours differs.
      # create_host_path: false -> a wrong path fails loudly instead of creating a directory.
      - type: bind
        source: ${FACTORIO_DATA_DIR:-/opt/factorio}/config/rconpw
        target: /run/rconpw
        read_only: true
        bind:
          create_host_path: false
    # Must be able to read rconpw: use the owner of that file
    # (stat -c %u:%g "$FACTORIO_DATA_DIR/config/rconpw"); factoriotools defaults to 845.
    user: "845:845"
    mem_limit: 96m
