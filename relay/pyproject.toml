[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-ha-relay"
version = "0.4.1"
description = "Relays factorio-ha mod telemetry (UDP) to MQTT and HA config back over RCON"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["aiomqtt>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["factorio_ha_relay*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
